# Optional local n8n for AI Shorts Factory orchestration.
# Not required for story creation, Flow Package, upload, verification, or assembly.
#
# Usage (from repo root):
#   docker compose -f docker/n8n/docker-compose.yml up -d
#
# UI: http://localhost:5678
# Persist: docker/n8n/data

services:
  n8n:
    image: n8nio/n8n:1.72.1
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Karachi
      - TZ=Asia/Karachi
      # Shared with AI Shorts Factory N8N_WEBHOOK_SECRET for HMAC validation inside workflows
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-change-me-local-only}
      - ASF_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-change-me-local-only}
      - ASF_CALLBACK_BASE_URL=${N8N_CALLBACK_BASE_URL:-http://host.docker.internal:3000}
      - APP_URL=${APP_URL:-http://host.docker.internal:3000}
      - ASF_OPERATOR_USER_ID=${ASF_OPERATOR_USER_ID:-00000000-0000-4000-8000-000000000001}
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
    volumes:
      - ./data:/home/node/.n8n
    extra_hosts:
      - 'host.docker.internal:host-gateway'
